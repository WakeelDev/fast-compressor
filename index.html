<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FastCompress | Multi-Image Bulk Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ad-box { background: #f3f4f6; border: 1px dashed #ccc; padding: 15px; text-align: center; margin: 15px 0; border-radius: 8px; color: #999; font-size: 12px; }
        .file-pill { background: #eff6ff; border: 1px solid #dbeafe; padding: 4px 12px; border-radius: 999px; font-size: 14px; color: #1e40af; margin: 4px; display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 font-sans">

    <div class="ad-box">TOP AD SLOT</div>

    <div class="max-w-xl mx-auto py-10 px-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
            <h1 class="text-3xl font-black text-blue-600 text-center mb-1 italic">FastCompress</h1>
            <p class="text-center text-slate-400 mb-8 font-medium">Add images one by one or in bulk</p>

            <div id="drop-zone" class="border-4 border-dashed border-slate-200 rounded-2xl p-12 text-center hover:border-blue-500 hover:bg-blue-50 cursor-pointer transition-all group">
                <input type="file" id="file-input" class="hidden" multiple accept="image/*">
                <div class="space-y-4">
                    <div class="text-5xl group-hover:scale-110 transition-transform">📸</div>
                    <button onclick="document.getElementById('file-input').click()" class="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200">Add Images</button>
                    <p class="text-slate-400 text-sm">Drag & drop to add to your list</p>
                </div>
            </div>

            <div id="queue-section" class="mt-8 hidden border-t pt-6">
                <h3 class="font-bold text-slate-700 mb-3">Images to Process (<span id="file-count">0</span>):</h3>
                <div id="file-list" class="flex flex-wrap mb-6"></div>
                
                <button id="process-btn" class="w-full bg-emerald-500 text-white py-4 rounded-xl font-black text-lg hover:bg-emerald-600 shadow-lg shadow-emerald-100 transition-all uppercase tracking-wider">
                    Compress & Download All
                </button>
            </div>

            <div id="loader" class="mt-4 hidden text-center animate-pulse text-blue-600 font-bold">
                Compressing your images... please wait.
            </div>
        </div>
    </div>

    <div class="ad-box">BOTTOM AD SLOT</div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const queueSection = document.getElementById('queue-section');
        const fileListDiv = document.getElementById('file-list');
        const fileCountSpan = document.getElementById('file-count');
        const processBtn = document.getElementById('process-btn');
        const loader = document.getElementById('loader');

        // This is your "Queue" that stores images sequentially
        let allFiles = [];

        // Prevention Shield
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(name => {
            dropZone.addEventListener(name, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        // Handle Drops
        dropZone.addEventListener('drop', (e) => {
            addFilesToQueue(e.dataTransfer.files);
        });

        // Handle Button Clicks
        fileInput.onchange = (e) => {
            addFilesToQueue(e.target.files);
        };

        function addFilesToQueue(newFiles) {
            for (let f of newFiles) {
                // Add unique ID to each file to avoid issues
                allFiles.push(f);
                
                // Add to visual list
                const pill = document.createElement('span');
                pill.className = 'file-pill';
                pill.innerText = f.name;
                fileListDiv.appendChild(pill);
            }
            
            // Update UI
            fileCountSpan.innerText = allFiles.length;
            queueSection.classList.remove('hidden');
            processBtn.innerText = "Compress " + allFiles.length + " Image" + (allFiles.length > 1 ? "s" : "");
        }

        processBtn.onclick = async () => {
            if (allFiles.length === 0) return;

            // Show loading
            loader.classList.remove('hidden');
            processBtn.classList.add('hidden');

            const formData = new FormData();
            for (let f of allFiles) {
                formData.append('files', f);
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/compress/images', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Server Error");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                // Download
                const link = document.createElement('a');
                link.href = url;
                link.download = allFiles.length > 1 ? "fastcompress_batch.zip" : "compressed_image.webp";
                document.body.appendChild(link);
                link.click();
                link.remove();

                // Reset for next batch
                allFiles = [];
                fileListDiv.innerHTML = "";
                queueSection.classList.add('hidden');
                loader.classList.add('hidden');
                processBtn.classList.remove('hidden');

            } catch (err) {
                alert("Error: Make sure your Python (main.py) is running!");
                loader.classList.add('hidden');
                processBtn.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
